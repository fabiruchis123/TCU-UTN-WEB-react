# =============================================================================
# Configuración Nginx de Producción - TCU-102A UTN Guanacaste
# Optimizado para Single Page Application (SPA) con React & Vite
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Compresión Gzip de Alto Rendimiento
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Blindaje y Cabeceras de Seguridad Web (OWASP Recommended)
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Content Security Policy (CSP) adaptada para fuentes, iconos y recursos externos
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; frame-src 'self' https://www.google.com https://www.youtube.com https://www.youtube-nocookie.com https://lookerstudio.google.com; connect-src 'self' https:; base-uri 'self'; form-action 'self';" always;

    # -------------------------------------------------------------------------
    # Endpoint de Salud (Healthcheck) para Docker, Kubernetes o Reverse Proxy
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # -------------------------------------------------------------------------
    # Política de Caché para index.html (SPA Entrypoint)
    # IMPORTANTE: Nunca cachear index.html para permitir despliegues instantáneos
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -------------------------------------------------------------------------
    # Activos con Hash de Vite (/assets/) - Caché Inmutable de 1 Año
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Recursos Estáticos Generales (Imágenes, Fuentes, Iconos, Documentos)
    # -------------------------------------------------------------------------
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf|pdf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Enrutamiento SPA: Redirección de Rutas Virtuales a index.html
    # Permite recargar URLs como /cartografia, /sigaru, /normativa sin 404
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Denegar Acceso a Archivos y Carpetas Ocultas (ej: .git, .env)
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Páginas de Error Personalizadas
    # -------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
